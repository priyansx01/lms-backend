# SmartFM LMS Backend — Docker Compose (Infrastructure Only)
# The Go API runs natively on the host; infra runs in Docker.
#
# Usage:
#   docker compose up -d                      # start infra
#   make run                                  # start Go API separately
#   docker compose down -v                    # stop + remove volumes

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_secret
      POSTGRES_DB: smartfm_lms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d smartfm_lms"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MinIO 1: Raw Video Uploads ────────────────────────────────────────────
  # Console UI: http://localhost:9001  (minioadmin / minioadmin)
  minio-raw:
    image: minio/minio:latest
    container_name: lms-minio-raw
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Console UI
    volumes:
      - minio_raw_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MinIO 2: HLS Processed Videos ────────────────────────────────────────
  # Console UI: http://localhost:9003  (minioadmin / minioadmin)
  minio-hls:
    image: minio/minio:latest
    container_name: lms-minio-hls
    restart: unless-stopped
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"    # S3 API
      - "9003:9003"    # Console UI
    volumes:
      - minio_hls_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio_raw_data:
  minio_hls_data:
